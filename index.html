<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふところ帳</title>
<meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふところ帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone column like a pocket ledger; sticky month header, fixed bottom tab bar */
:root{
  --paper:#f3f4ef; --card:#ffffff; --ink:#1b2730; --muted:#5d6a72; --line:#dbe0d8; --soft:#eaede5;
  --ai:#244a7c; --ai-soft:#e2e9f3; --shu:#b8412a; --moss:#2b7450; --on-ai:#ffffff;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161b; --card:#182027; --ink:#e4e9ec; --muted:#97a3ab; --line:#2a333b; --soft:#1f2830;
  --ai:#8fb1e8; --ai-soft:#22324a; --shu:#ee8068; --moss:#6fc79a; --on-ai:#0f1a2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161b; --card:#182027; --ink:#e4e9ec; --muted:#97a3ab; --line:#2a333b; --soft:#1f2830;
  --ai:#8fb1e8; --ai-soft:#22324a; --shu:#ee8068; --moss:#6fc79a; --on-ai:#0f1a2a; color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.exp{color:var(--shu)} .inc{color:var(--moss)} .muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.stamp{width:28px;height:28px;border:2px solid var(--shu);color:var(--shu);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:15px;transform:rotate(-4deg);flex:none}
.brand-t{font-weight:700;font-size:16px;white-space:nowrap}
.status{font-size:11px;letter-spacing:.04em;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--moss)} .status.bad{color:var(--shu)}
.hr{display:flex;align-items:center;gap:4px}
.mnav{display:flex;align-items:center}
.mnav button{border:0;background:none;width:32px;height:34px;border-radius:8px;font-size:18px;color:var(--muted)}
.mnav button:hover{background:var(--soft)}
.mnav .m{font-weight:700;font-size:15px;min-width:6.2em;text-align:center}
.gear{border:1px solid var(--line);background:var(--card);border-radius:8px;height:32px;padding:0 9px;font-size:12.5px;color:var(--muted)}
.gear.on{border-color:var(--ai);color:var(--ai);font-weight:700}
@media (max-width:420px){.brand-t{display:none}}

main{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 10px}
.banner{font-size:13px;background:var(--ai-soft);border-radius:10px;padding:10px 12px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools .h2{margin:0}

.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.sum div{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum div+div{border-left:1px solid var(--line)}
.sum .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.sum .v{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

form{display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:none;border-radius:8px;padding:7px 0;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on.t-expense{color:var(--shu)} .seg button.on.t-income{color:var(--moss)} .seg button.on.t-transfer,.seg button.on.t-journal{color:var(--ai)}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-block:2px 6px}
.amt:focus-within{border-color:var(--ai)}
.amt .yen{font-family:var(--f-num);font-size:22px;color:var(--muted)}
.amt input{border:0;background:none;outline:none;width:100%;min-width:0;font-family:var(--f-num);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
.lab{font-size:12px;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip.on{background:var(--ai);border-color:var(--ai);color:var(--on-ai);font-weight:700}
.cgrp{display:flex;flex-direction:column;gap:5px}
.cgrp+.cgrp{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select,.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;height:40px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--on-ai);flex:1 1 140px}
.btn.danger{color:var(--shu);border-color:var(--shu)}
.btn.ghost{color:var(--muted)}
.btn.sm{padding:5px 12px;font-size:13px;font-weight:500}
.err{margin:0;color:var(--shu);font-size:13px}

.jside{display:flex;flex-direction:column;gap:6px}
.jrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 32px;gap:6px;align-items:center}
.jrow select,.jrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;height:38px}
.jrow input{text-align:right}
.jtot{font-size:13px;display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:16px}

.day{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px 4px;border-bottom:1px solid var(--line)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px dashed var(--line);background:none;padding:9px 4px}
.tx:hover,.tx.sel{background:var(--soft)}
.tx-main{display:flex;flex-direction:column;min-width:0}
.tx-cat{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:600;white-space:nowrap}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-right:5px;font-weight:500;vertical-align:1px}
.days{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;color:var(--muted);padding:24px 12px;border:1px dashed var(--line);border-radius:14px;font-size:13px}
.empty-t{font-weight:700;color:var(--ink);font-size:15px;margin:0 0 4px}
.empty p{margin:0}

.big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big .v{font-size:28px;font-weight:600}
.big .side{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;min-width:0}
.stats .k{font-size:11px;color:var(--muted)}
.stats .v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg.chart{display:block;width:100%;height:auto;max-width:100%;margin-top:6px}
svg.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
.sc{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sc .chip{flex:none}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;font-weight:500;color:var(--muted);text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.num{font-size:13px}
td.ind{padding-left:20px}
tr.head td{background:var(--soft);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;padding-block:5px;text-align:center}
tr.grp td{font-weight:700}
tr.sub td{font-weight:700;border-top:1px solid var(--ink)}
tr.grand td{font-weight:700;border-top:2px solid var(--ink);border-bottom:3px double var(--ink);font-size:14.5px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.calbar select{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:9px;height:38px;padding:0 8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.cal .wd.su,.cday.su .d{color:var(--shu)} .cal .wd.sa,.cday.sa .d{color:var(--ai)}
.cday{border:1px solid var(--line);background:var(--card);border-radius:8px;min-height:50px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cday .d{font-size:12px;line-height:1.4;padding:0 6px;border-radius:999px}
.cday .v{font-family:var(--f-num);font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;max-width:100%}
.cday.none{background:none}
.cday.sel{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.cday.today .d{background:var(--ai);color:var(--on-ai)!important}
.je{border-bottom:1px dashed var(--line);padding-block:10px}
.je:last-child{border-bottom:0}
.je-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.je-h .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.jt{font-size:12.5px}
table.jt td,table.jt th{padding:3px 4px;border-bottom:0}
table.jt th{border-bottom:1px solid var(--line)}
table.jt td.k{text-align:left;white-space:normal}
table.jt tr.hl td{background:var(--ai-soft)}

.ac{display:grid;grid-template-columns:minmax(0,1fr) 7.2em auto 32px;gap:6px;align-items:center;padding-block:5px;border-bottom:1px dashed var(--line)}
.ac input[type=text],.ac input:not([type]){width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;height:34px}
.ac .op{text-align:right}
.ac .vis{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px;white-space:nowrap}
.secl{font-size:12px;font-weight:700;color:var(--ai);margin:14px 0 2px;letter-spacing:.04em}
.secl:first-of-type{margin-top:0}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-top:12px}
.addrow select,.addrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;height:36px}
.sch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:8px;border-bottom:1px dashed var(--line);font-size:13.5px}
.sch .t{min-width:0}
.sch .s{font-size:12px;color:var(--muted)}
.kform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kform .full{grid-column:1/-1}
.savebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4}
.dirty{font-size:12px;color:var(--shu);margin-right:auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
nav.tabs button{border:0;background:none;padding:10px 0 8px;font-size:12.5px;color:var(--muted);position:relative;font-weight:500;white-space:nowrap}
nav.tabs button.on{color:var(--ai);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ai)}

.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 24px rgba(0,0,0,.15)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sheet textarea{width:100%;height:160px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-num);font-size:12px;background:var(--paper)}
.acrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px dashed var(--line);background:none;padding:8px 4px}
.acrow:hover,.acrow.open{background:var(--soft)}
.acrow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acrow .r{font-size:12px;color:var(--muted);white-space:nowrap}
.aced{background:var(--soft);border-radius:0 0 10px 10px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.aced .full{grid-column:1/-1}
.aced .fld input,.aced .fld select{height:38px}
.sug{grid-column:1/-1;font-size:13px;background:var(--ai-soft);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.bud{display:flex;flex-direction:column;gap:10px}
.bud-r{display:flex;flex-direction:column;gap:3px}
.bud-h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.bud-h .num{font-size:12.5px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);border-radius:3px}
.bar i.over{background:var(--shu)}
.bset{display:grid;grid-template-columns:minmax(0,1fr) 8em;gap:6px;align-items:center;padding-block:4px;border-bottom:1px dashed var(--line);font-size:13.5px}
.bset input{border:1px solid var(--line);background:var(--card);border-radius:8px;height:34px;padding:4px 8px;text-align:right;width:100%;min-width:0}
.disp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;width:100%}
.disp .full{grid-column:1/-1}
.steps{margin:0;padding-left:1.3em;font-size:13px;display:flex;flex-direction:column;gap:4px}
/* PDF report pages: printed paper, fixed light palette */
#rpwrap{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none}
.rp{--ink:#1b2730;--muted:#5d6a72;--line:#cfd5cc;--soft:#eef0ea;--ai:#244a7c;--rp-ink:#1b2730;--rp-muted:#5d6a72;--rp-line:#cfd5cc;--rp-soft:#eef0ea;--rp-ai:#244a7c;--rp-shu:#b8412a;--rp-moss:#2b7450;
  width:794px;height:1123px;background:#ffffff;color:var(--rp-ink);font-family:var(--f-ui);font-size:11px;line-height:1.5;padding:48px 52px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.rp h1{font-size:20px;margin:0;font-weight:700}
.rp h2{font-size:12px;margin:0 0 6px;color:var(--rp-ai);letter-spacing:.06em;border-bottom:1.5px solid var(--rp-ai);padding-bottom:3px}
.rp .meta{color:var(--rp-muted);font-size:10px}
.rp .kp{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--rp-line);border-radius:6px}
.rp .kp div{padding:8px 10px;display:flex;flex-direction:column}
.rp .kp div+div{border-left:1px solid var(--rp-line)}
.rp .kp .k{font-size:9px;color:var(--rp-muted)} .rp .kp .v{font-family:var(--f-num);font-size:14px;font-weight:600}
.rp table{width:100%;border-collapse:collapse;font-size:10.5px}
.rp th{font-size:9px;color:var(--rp-muted);font-weight:500;border-bottom:1px solid var(--rp-ink);padding:3px 5px;text-align:right}
.rp td{border-bottom:1px solid var(--rp-line);padding:3px 5px;text-align:right;white-space:nowrap}
.rp th:first-child,.rp td:first-child{text-align:left}
.rp td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.rp tr.head td{background:var(--rp-soft);text-align:center;font-weight:700;color:var(--rp-muted)}
.rp tr.grp td{font-weight:700} .rp tr.sub td{font-weight:700;border-top:1px solid var(--rp-ink)}
.rp tr.grand td{font-weight:700;border-top:1.5px solid var(--rp-ink);border-bottom:3px double var(--rp-ink)}
.rp td.ind{padding-left:16px}
.rp .exp{color:var(--rp-shu)} .rp .inc{color:var(--rp-moss)}
.rp .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.rp .wide td,.rp .wide th{padding:2px 3px;font-size:9px}
.rp .foot{position:absolute;bottom:22px;left:52px;right:52px;display:flex;justify-content:space-between;color:var(--rp-muted);font-size:9px}
.rp .hb{display:flex;align-items:center;gap:6px}
.rp .hb i{display:block;height:7px;background:var(--rp-ai);border-radius:2px}
@media (max-width:400px){.ac{grid-template-columns:minmax(0,1fr) 6.2em 32px}.ac .vis{grid-column:1/2;grid-row:2}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="stamp" aria-hidden="true">帳</span><span class="brand-t">ふところ帳</span><span class="status" id="status">読み込み中</span></div>
    <div class="hr">

<script>
(function(){
/* ---------- chart of accounts ---------- */
const SEC={ca:["A","流動資産"],fa:["A","固定資産"],cl:["L","流動負債"],fl:["L","固定負債"],eq:["E","純資産"],
  rop:["R","経常収入"],rfin:["R","金融収益"],rsp:["R","臨時収入"],xop:["X","生活費"],xfin:["X","金融費用"],xsp:["X","臨時支出"],xtax:["X","税金・社会保険料"]};
const SEC_ORDER=["ca","fa","cl","fl","eq","rop","rfin","rsp","xop","xfin","xsp","xtax"];
const EL={A:"資産",L:"負債",E:"純資産",R:"収益",X:"費用"};
const A_=(id,name,sec,o)=>Object.assign({id,name,sec,hide:false,open:0},o||{});
const DEFS={ver:2,migrated:false,sched:[],budget:{},accounts:[
  A_("cash","現金","ca"),A_("bank","普通預金","ca"),A_("emoney","電子マネー","ca"),A_("tatekae","立替金","ca"),A_("maebarai","前払費用","ca",{sys:true}),A_("mishu","未収収益","ca"),
  A_("bihin","備品","fa"),A_("yuka","投資有価証券","fa"),A_("accdep","減価償却累計額","fa",{sys:true,contra:true}),
  A_("card","未払金（カード）","cl"),A_("mibarai","未払費用","cl"),A_("maeuke","前受収益","cl"),A_("kariire","長期借入金","fl"),
  A_("motoire","元入金","eq",{sys:true}),A_("kurikoshi","繰越利益剰余金","eq",{sys:true}),
  A_("kyuyo","給与","rop"),A_("baito","アルバイト","rop"),A_("rishi","受取利息","rfin"),A_("haito","受取配当金","rfin"),A_("rinji","臨時収入","rsp"),A_("baikyakueki","固定資産売却益","rsp",{sys:true}),
  A_("food","食費","xop"),A_("eat","外食","xop"),A_("daily","日用品","xop"),A_("trans","交通費","xop"),A_("kosai","交際費","xop"),A_("hobby","趣味・娯楽","xop"),
  A_("cloth","衣服・美容","xop"),A_("house","住居費","xop"),A_("util","水道光熱費","xop"),A_("tel","通信費","xop"),A_("edu","教育・書籍","xop"),A_("med","医療・健康","xop"),
  A_("hoken","保険料","xop"),A_("fee","支払手数料","xop"),A_("depx","減価償却費","xop",{sys:true}),A_("misc","雑費","xop"),
  A_("payint","支払利息","xfin"),A_("kankon","冠婚葬祭","xsp"),A_("tokubetsu","臨時支出","xsp"),A_("baikyakuson","固定資産売却損","xsp",{sys:true}),A_("jokyakuson","固定資産除却損","xsp",{sys:true}),A_("zei","租税公課","xtax"),A_("shaho","社会保険料","xtax")]};
const ACCRUAL=new Set(["maebarai","mishu","mibarai","maeuke","accdep"]);

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const plain=n=>Math.round(n).toLocaleString("ja-JP");
const yen=n=>(n<0?"-":"")+"¥"+plain(Math.abs(n));
const fmtB=v=>v<0?"△"+plain(-v):plain(v);
const ymOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const dateOf=d=>ymOf(d)+"-"+pad(d.getDate());
const addM=(m,n)=>{let[y,mo]=m.split("-").map(Number);mo+=n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+"-"+pad(mo)};
const monthsBack=(end,n)=>Array.from({length:n},(_,i)=>addM(end,i-n+1));
const mLabel=m=>{const[y,mo]=m.split("-");return y+"年"+(+mo)+"月"};
const daysIn=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()};
const short=v=>{const a=Math.abs(v);if(a>=10000){const x=v/10000;return (Math.abs(x)>=10?Math.round(x):Math.round(x*10)/10)+"万"}return plain(v)};
const digits=s=>String(s||"").replace(/[^\d]/g,"").slice(0,11);
const WD=["日","月","火","水","木","金","土"];
const mOf=e=>String(e.date).slice(0,7);

/* ---------- state ---------- */
let settings,ACC={},txs=[],oldTx=[],mode="loading",sync="loading",setRef=null,jeCol=null,oldCol=null;
let month=ymOf(new Date()),tab="input",editId=null,delArm=false,trendKey="__xop",plPeriod="month",sdraft=null,calAcc="__net",calDay=null,busy=false;
let ENT=null,PLM={};
let openAcc=null,sug=null,aiBusy=false,newSec="auto",newName="",dispOpen=null,dispForm={},impPending=null,downloadsFn=null,sampleFn=null;
function setSettings(s){settings=s;ACC={};for(const a of s.accounts)ACC[a.id]=a;invalidate()}
function invalidate(){ENT=null;PLM={}}
setSettings(clone(DEFS));
const elOf=a=>SEC[a.sec][0];
const accName=id=>ACC[id]?ACC[id].name:"(不明な科目)";
const visAccs=secs=>settings.accounts.filter(a=>!a.hide&&!a.contra&&secs.includes(a.sec));
const payAccs=()=>visAccs(["ca","cl"]).filter(a=>!ACCRUAL.has(a.id));
const expAccs=()=>visAccs(["xop","xfin","xsp","xtax"]).filter(a=>a.id!=="depx");
const incAccs=()=>visAccs(["rop","rfin","rsp"]);
const xferAccs=()=>visAccs(["ca","fa","cl","fl"]);
let schForm=freshSch();
function freshSch(){return{type:"dep",name:"",date:dateOf(new Date()),amt:"",len:"4",pay:"bank",asset:"bihin",exp:"hoken"}}

/* ---------- ledger engine ---------- */
function genEntries(){
  const out=[];
  for(const s of settings.sched||[]){
    const n=Math.max(1,s.months|0),amt=+s.amount||0;if(!amt||!s.date)continue;
    out.push({id:"g-"+s.id+"-0",auto:true,date:s.date,mode:"journal",memo:s.name+(s.type==="dep"?"（取得）":"（前払い）"),lines:[{s:"d",a:s.asset,n:amt},{s:"c",a:s.pay,n:amt}],ts:0});
    const per=Math.floor(amt/n),m0=s.date.slice(0,7),disp=s.type==="dep"&&s.disp&&s.disp.date>=s.date?s.disp:null,dm=disp?disp.date.slice(0,7):null;
    let acc=0;
    for(let i=0;i<n;i++){const m=addM(m0,i);if(dm&&m>dm)break;const v=i===n-1?amt-per*(n-1):per;if(v<=0)continue;acc+=v;
      out.push({id:"g-"+s.id+"-"+(i+1),auto:true,date:dm===m?disp.date:m+"-"+pad(daysIn(m)),mode:"journal",memo:s.name+(s.type==="dep"?" 減価償却 ":" 費用化 ")+(i+1)+"/"+n,
        lines:[{s:"d",a:s.exp,n:v},{s:"c",a:s.type==="dep"?"accdep":s.asset,n:v}],ts:1})}
    if(disp){const price=+disp.price||0,gain=price-(amt-acc),lines=[];
      if(acc)lines.push({s:"d",a:"accdep",n:acc});if(price)lines.push({s:"d",a:disp.to||"bank",n:price});
      if(gain<0)lines.push({s:"d",a:price?"baikyakuson":"jokyakuson",n:-gain});
      lines.push({s:"c",a:s.asset,n:amt});if(gain>0)lines.push({s:"c",a:"baikyakueki",n:gain});
      out.push({id:"g-"+s.id+"-x",auto:true,date:disp.date,mode:"journal",memo:s.name+(price?"（売却）":"（除却）"),lines,ts:2})}
  }
  return out;
}
function entries(){if(!ENT)ENT=txs.concat(genEntries());return ENT}
function sumLines(list){const m={};for(const e of list)for(const l of e.lines)m[l.a]=(m[l.a]||0)+(l.s==="d"?l.n:-l.n);return m}
function accBal(nd,a){const e=elOf(a);return (e==="A"||e==="X")?(nd||0):-(nd||0)}
function plOf(list){
  const nd=sumLines(list),g={rop:0,rfin:0,rsp:0,xop:0,xfin:0,xsp:0,xtax:0},by={};
  for(const a of settings.accounts){if(!(a.sec in g))continue;const v=accBal(nd[a.id],a);by[a.id]=v;g[a.sec]+=v}
  const op=g.rop-g.xop,ord=op+g.rfin-g.xfin,pre=ord+g.rsp-g.xsp,net=pre-g.xtax;
  return{g,by,op,ord,pre,net,rev:g.rop+g.rfin+g.rsp,exp:g.xop+g.xfin+g.xsp+g.xtax};
}
function plM(m){if(!PLM[m])PLM[m]=plOf(entries().filter(e=>mOf(e)===m));return PLM[m]}
function bsAt(m){
  const list=entries().filter(e=>mOf(e)<=m),nd=sumLines(list),bal={};let od=0;
  for(const a of settings.accounts){const e=elOf(a);let v=accBal(nd[a.id],a);
    if(e==="A"){const o=(a.contra?-1:1)*(+a.open||0);v+=o;od+=o}else if(e==="L"){v+=(+a.open||0);od-=(+a.open||0)}
    bal[a.id]=v}
  const y0=m.slice(0,4)+"-01",prior=plOf(list.filter(e=>mOf(e)<y0)).net,cur=plOf(list.filter(e=>mOf(e)>=y0)).net;
  bal.motoire=(bal.motoire||0)+od;bal.kurikoshi=(bal.kurikoshi||0)+prior;
  const sum=k=>settings.accounts.filter(a=>a.sec===k).reduce((s,a)=>s+bal[a.id],0);
  const A=sum("ca")+sum("fa"),L=sum("cl")+sum("fl"),E=sum("eq")+cur;
  return{bal,cur,sum,A,L,E};
}
function eff(e){let v=0;for(const l of e.lines){const a=ACC[l.a];if(!a)continue;const el=elOf(a);if(el==="R")v+=l.s==="c"?l.n:-l.n;else if(el==="X")v+=l.s==="d"?-l.n:l.n}return v}
const total=e=>e.lines.filter(l=>l.s==="d").reduce((s,l)=>s+l.n,0);
function mv(list,id){const a=ACC[id];if(!a)return 0;const cr=["L","E","R"].includes(elOf(a));let v=0;for(const e of list)for(const l of e.lines)if(l.a===id)v+=((l.s==="d")!==cr)?l.n:-l.n;return v}
function describe(e){
  const d=e.lines.filter(l=>l.s==="d"),c=e.lines.filter(l=>l.s==="c"),nm=l=>accName(l.a);
  if(e.mode==="expense"&&d.length===1&&c.length===1)return[nm(d[0]),nm(c[0])];
  if(e.mode==="income"&&d.length===1&&c.length===1)return[nm(c[0]),nm(d[0])];
  if(e.mode==="transfer"&&d.length===1&&c.length===1)return["振替 "+nm(c[0])+" → "+nm(d[0]),""];
  return[d.map(nm).join("・")+" / "+c.map(nm).join("・"),""];
}
function amtHtml(e){const v=eff(e);if(v<0)return `<span class="num tx-amt exp">-${yen(-v)}</span>`;if(v>0)return `<span class="num tx-amt inc">+${yen(v)}</span>`;return `<span class="num tx-amt muted">${yen(total(e))}</span>`}
const sortE=l=>l.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));

/* ---------- form ---------- */
function defaultDate(){const now=new Date();return month===ymOf(now)?dateOf(now):month+"-01"}
function freshForm(){const p=payAccs();return{mode:"expense",amount:"",x:(expAccs()[0]||{}).id,pay:(p[0]||{}).id,to:(p[1]||p[0]||{}).id,date:defaultDate(),memo:"",dr:[{a:"",n:""}],cr:[{a:"",n:""}]}}
let form=freshForm();
function ensureForm(){
  const f=form;if(!ACC[f.pay])f.pay=(payAccs()[0]||{}).id;if(!ACC[f.to])f.to=(payAccs()[1]||{}).id;
  if(f.mode==="expense"&&!(ACC[f.x]&&elOf(ACC[f.x])==="X"))f.x=(expAccs()[0]||{}).id;
  if(f.mode==="income"&&!(ACC[f.x]&&elOf(ACC[f.x])==="R"))f.x=(incAccs()[0]||{}).id;
}
function loadEntry(e){
  const d=e.lines.filter(l=>l.s==="d"),c=e.lines.filter(l=>l.s==="c"),f=freshForm();f.date=e.date;f.memo=e.memo||"";
  if(e.mode!=="journal"&&d.length===1&&c.length===1){f.mode=e.mode;f.amount=String(d[0].n);
    if(e.mode==="expense"){f.x=d[0].a;f.pay=c[0].a}else if(e.mode==="income"){f.x=c[0].a;f.pay=d[0].a}else{f.to=d[0].a;f.pay=c[0].a}}
  else{f.mode="journal";f.dr=d.map(l=>({a:l.a,n:String(l.n)}));f.cr=c.map(l=>({a:l.a,n:String(l.n)}))}
  return f;
}
function simpleLines(f){const n=parseInt(f.amount,10)||0;
  if(f.mode==="expense")return[{s:"d",a:f.x,n},{s:"c",a:f.pay,n}];
  if(f.mode==="income")return[{s:"d",a:f.pay,n},{s:"c",a:f.x,n}];
  return[{s:"d",a:f.to,n},{s:"c",a:f.pay,n}]}
function buildEntry(){
  const f=form;let lines=[];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date))return{err:"日付を選んでください。"};
  if(f.mode!=="journal"){
    if(!(parseInt(f.amount,10)>0))return{err:"金額を入力してください。"};
    if(f.mode==="transfer"&&f.to===f.pay)return{err:"出金元と入金先は別の科目を選んでください。"};
    lines=simpleLines(f);if(lines.some(l=>!ACC[l.a]))return{err:"科目を選んでください。"};
  }else{
    for(const[s,rows]of[["d",f.dr],["c",f.cr]])for(const r of rows){const n=parseInt(r.n,10)||0;if(!n&&!r.a)continue;
      if(!r.a)return{err:"金額を入れた行の科目を選んでください。"};if(!(n>0))return{err:"科目を選んだ行の金額を入力してください。"};lines.push({s,a:r.a,n})}
    const td=lines.filter(l=>l.s==="d").reduce((s,l)=>s+l.n,0),tc=lines.filter(l=>l.s==="c").reduce((s,l)=>s+l.n,0);
    if(!td||!tc)return{err:"借方と貸方の両方を入力してください。"};
    if(td!==tc)return{err:"借方と貸方の合計が一致していません（差額 "+yen(Math.abs(td-tc))+"）。"};
  }
  return{data:{date:f.date,mode:f.mode,lines,memo:f.memo.trim(),ts:Date.now()}};
}

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function barChart(vals,labels,color,avg){
  const W=340,H=196,L=42,R=8,T=20,B=24,iw=W-L-R,ih=H-T-B,max=niceMax(Math.max(...vals,avg||0));
  const y=v=>T+ih-(v/max)*ih,bw=iw/vals.length;let s="";
  [0,max/2,max].forEach(g=>{s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-6}" y="${y(g)+3.5}" text-anchor="end">${short(g)}</text>`});
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,last=i===vals.length-1;
    s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,T+ih-y(v))}" rx="3" fill="${color}" opacity="${last?1:.4}"/>`;
    s+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${labels[i]}</text>`;
    if(last&&v>0)s+=`<text x="${x+w/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${short(v)}</text>`});
  if(avg>0)s+=`<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink)" stroke-dasharray="3 3" stroke-width="1" opacity=".55"/><text x="${L+4}" y="${y(avg)-4}" style="fill:var(--ink)">平均 ${short(avg)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の棒グラフ">${s}</svg>`;
}
function lineChart(vals,labels,color,label){
  const W=340,H=180,L=46,R=14,T=22,B=24,iw=W-L-R,ih=H-T-B;
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);hi=hi>0?niceMax(hi):0;lo=lo<0?-niceMax(-lo):0;if(hi===lo)hi=1000;
  const y=v=>T+ih-((v-lo)/(hi-lo))*ih,x=i=>L+(vals.length===1?iw/2:i*iw/(vals.length-1));let s="";
  (lo<0&&hi>0?[lo,0,hi]:[lo,(lo+hi)/2,hi]).forEach(g=>{s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-6}" y="${y(g)+3.5}" text-anchor="end">${short(g)}</text>`});
  const pts=vals.map((v,i)=>x(i)+","+y(v)).join(" "),base=y(Math.min(Math.max(lo,0),hi));
  s+=`<polygon points="${x(0)},${base} ${pts} ${x(vals.length-1)},${base}" fill="${color}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${labels[i]}</text>`});
  const li=vals.length-1;s+=`<circle cx="${x(li)}" cy="${y(vals[li])}" r="4" fill="${color}"/><text x="${x(li)}" y="${y(vals[li])-9}" text-anchor="end" style="fill:var(--ink);font-weight:600">${short(vals[li])}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${s}</svg>`;
}

/* ---------- views ---------- */
function renderSummary(){const p=plM(month);
  return `<div class="sum"><div><span class="k">収益</span><span class="v num inc">${yen(p.rev)}</span></div><div><span class="k">費用</span><span class="v num exp">${yen(p.exp)}</span></div><div><span class="k">当月純利益</span><span class="v num ${p.net<0?"exp":""}">${yen(p.net)}</span></div></div>`}
function optList(list,sel){return list.map(a=>`<option value="${esc(a.id)}"${a.id===sel?" selected":""}>${esc(a.name)}</option>`).join("")}
function optWithSel(list,sel){if(sel&&ACC[sel]&&!list.some(a=>a.id===sel))list=[ACC[sel]].concat(list);return optList(list,sel)}
function optAll(sel){
  let h=`<option value="">科目を選択</option>`;
  for(const el of["A","L","E","R","X"]){const l=settings.accounts.filter(a=>elOf(a)===el&&(!a.hide||a.id===sel));if(!l.length)continue;
    h+=`<optgroup label="${EL[el]}">${optList(l,sel)}</optgroup>`}
  return h;
}
function chipGroups(list,sel){
  if(sel&&ACC[sel]&&!list.some(a=>a.id===sel))list=list.concat([ACC[sel]]);
  const g=[];for(const k of SEC_ORDER){const l=list.filter(a=>a.sec===k);if(l.length)g.push([k,l])}
  return g.map(([k,l])=>`<div class="cgrp">${g.length>1?`<span class="lab">${SEC[k][1]}</span>`:""}<div class="chips">${l.map(a=>`<button type="button" class="chip${sel===a.id?" on":""}" data-act="fx" data-v="${esc(a.id)}">${esc(a.name)}</button>`).join("")}</div></div>`).join("");
}
function jTotals(){const s=rows=>rows.reduce((t,r)=>t+(parseInt(r.n,10)||0),0),d=s(form.dr),c=s(form.cr);
  return `<span>借方 <span class="num">${yen(d)}</span></span><span>貸方 <span class="num">${yen(c)}</span></span><span class="${d===c?"muted":"exp"}">差額 <span class="num">${yen(Math.abs(d-c))}</span></span>`}
function renderForm(){
  const f=form,J=f.mode==="journal",tr=f.mode==="transfer";

  let body="";
  if(!J){
    body=`<label class="amt"><span class="yen">¥</span><input id="f-amount" inputmode="numeric" placeholder="0" value="${esc(f.amount?plain(+f.amount):"")}" aria-label="金額"></label>
    ${tr?"":`<div class="fld"><span class="lab">${f.mode==="income"?"収益の科目":"費用の科目"}</span>${chipGroups(f.mode==="income"?incAccs():expAccs(),f.x)}</div>`}
    <div class="row2"><label class="fld"><span class="lab">${tr?"出金元（貸方）":f.mode==="income"?"入金先":"支払い元"}</span><select id="f-pay">${optWithSel(tr?xferAccs():payAccs(),f.pay)}</select></label>

    body=`${side("d",f.dr,"借方")}${side("c",f.cr,"貸方")}<div class="jtot" id="jtot">${jTotals()}</div>${dateF}`;
  }
  return `<form id="txform" autocomplete="off" novalidate>
  <div class="seg">${[["expense","支出"],["income","収入"],["transfer","振替"],["journal","仕訳"]].map(([k,l])=>`<button type="button" class="t-${k}${f.mode===k?" on":""}" data-act="fmode" data-v="${k}" aria-pressed="${f.mode===k}">${l}</button>`).join("")}</div>
  ${body}

  <p class="err" id="ferr" hidden></p>
  <div class="actions">${editId?`<button type="button" class="btn ghost" data-act="fcancel">やめる</button><button type="button" class="btn danger" data-act="fdel">${delArm?"もう一度押すと削除":"削除"}</button>`:""}<button type="submit" class="btn primary" ${busy?"disabled":""}>${editId?"更新する":"記録する"}</button></div>
  </form>`;
}
function txRow(e){const[t,s]=describe(e);

function renderList(){
  const l=sortE(entries().filter(e=>mOf(e)===month));
  if(!l.length)return sync==="loading"&&mode!=="demo"?`<div class="empty">読み込み中…</div>`:
    `<div class="empty"><p class="empty-t">${mLabel(month)}の記録はまだありません</p><p>金額と科目を選んで「記録する」を押すと、ここに日付ごとに並びます。</p></div>`;
  const g=new Map();for(const e of l){if(!g.has(e.date))g.set(e.date,[]);g.get(e.date).push(e)}
  let h="";for(const[d,rows]of g){const de=rows.reduce((a,e)=>a+eff(e),0);
    h+=`<div class="day"><div class="day-h"><span>${+d.slice(5,7)}/${+d.slice(8)} (${WD[new Date(d+"T00:00").getDay()]})</span><span class="num">${de?"収支 "+yen(de):""}</span></div>${rows.map(txRow).join("")}</div>`}

function jeBlock(e,hl){

  for(let i=0;i<n;i++){const a=d[i],b=c[i],h=hl&&((a&&a.a===hl)||(b&&b.a===hl));
    rows+=`<tr class="${h?"hl":""}"><td class="k">${a?esc(accName(a.a)):""}</td><td class="num">${a?plain(a.n):""}</td><td class="k">${b?esc(accName(b.a)):""}</td><td class="num">${b?plain(b.n):""}</td></tr>`}
  const[t]=describe(e);
  return `<div class="je"><div class="je-h"><span class="t">${e.auto?'<span class="tag">自動</span>':""}${esc(e.memo||t)}</span>${e.auto?"":`<button type="button" class="btn sm" data-act="edit" data-id="${esc(e.id)}">修正</button>`}</div>
  <table class="jt"><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderCal(){

    head=`<div class="stats"><div><span class="k">当月の${el==="R"||el==="X"?"発生額":"増減"}</span><span class="v num">${m>0&&bs?"+":""}${fmtB(m)}</span></div>${bs?`<div><span class="k">月末残高</span><span class="v num">${fmtB(bsAt(month).bal[calAcc])}</span></div>`:""}<div><span class="k">区分</span><span class="v">${SEC[a.sec][1]}</span></div></div>`}

    const col=calAcc==="__net"?(v<0?"exp":v>0?"inc":"muted"):"";
    g+=`<button type="button" class="cday${has?"":" none"}${calDay===d?" sel":""}${ds===today?" today":""}${dow===0?" su":dow===6?" sa":""}" data-act="cday" data-v="${d}" aria-label="${mo}月${d}日"><span class="d">${d}</span><span class="v ${col}">${has?(v>0&&calAcc==="__net"?"+":"")+(v<0?"-"+short(-v):short(v)):""}</span></button>`}

  <section class="card"><div class="cal">${g}</div></section>${det}`;

function trendKeys(){return[["__xop","生活費合計"],["__exp","費用合計"],["__rop","経常収入"],["__rev","収益合計"],["__net","当期純利益"],...settings.accounts.filter(a=>!a.hide&&elOf(a)==="X").map(a=>[a.id,a.name]),...settings.accounts.filter(a=>!a.hide&&elOf(a)==="R").map(a=>[a.id,a.name])]}
function trendVal(k,m){const p=plM(m);if(k==="__xop")return p.g.xop;if(k==="__exp")return p.exp;if(k==="__rop")return p.g.rop;if(k==="__rev")return p.rev;if(k==="__net")return p.net;return p.by[k]||0}

  ${rows.map(([k,l])=>`<tr class="${k.startsWith("__")?"grp":""}"><td>${esc(l)}</td>${ms.map(m=>{const v=trendVal(k,m);return `<td class="num${v?"":" muted"}">${fmtB(v)}</td>`}).join("")}</tr>`).join("")}
  </tbody></table></div></section>`;
}

function diffCell(cur,prev,goodUp){if(prev==null)return"<td></td>";const d=cur-prev;if(!d)return `<td class="num muted">±0</td>`;return `<td class="num ${(d>0)===goodUp?"inc":"exp"}">${d>0?"+":"-"}${plain(Math.abs(d))}</td>`}
function tableHtml(R,prevHead){

    return `<tr class="${r.t==="acc"?"":r.t}"><td class="${r.t==="acc"?"ind":""}">${esc(r.label)}</td><td class="num">${r.v==null?"":fmtB(r.v)}</td>${prevHead?(r.v==null?"<td></td>":diffCell(r.v,r.pv,r.good)):""}</tr>`}).join("")}</tbody></table></div>`;

const tsv=(R,head)=>[head.join("\t"),...R.map(r=>[r.label,r.v==null?"":r.v,r.pv==null||r.v==null?"":r.v-r.pv].join("\t"))].join("\n");
function plRows(p,pp){
  const R=[],show=a=>(p.by[a.id]||0)!==0||(pp&&(pp.by[a.id]||0)!==0);
  const sec=(k,label,good)=>{R.push({t:"grp",label,v:p.g[k],pv:pp?pp.g[k]:null,good});for(const a of settings.accounts.filter(a=>a.sec===k&&show(a)))R.push({t:"acc",label:a.name,v:p.by[a.id]||0,pv:pp?(pp.by[a.id]||0):null,good})};
  const sub=(label,k,t)=>R.push({t:t||"sub",label,v:p[k],pv:pp?pp[k]:null,good:true});
  sec("rop","Ⅰ 経常収入",true);sec("xop","Ⅱ 生活費",false);sub("経常収支（営業利益）","op");
  sec("rfin","Ⅲ 金融収益",true);sec("xfin","Ⅳ 金融費用",false);sub("経常収支・金融込み（経常利益）","ord");
  sec("rsp","Ⅴ 臨時収入",true);sec("xsp","Ⅵ 臨時支出",false);sub("税引前収支（税引前当期純利益）","pre");
  sec("xtax","税金・社会保険料（法人税等）",false);sub("当期純利益（貯蓄額）","net","grand");
  return R;
}

function budgetRows(m){const b=settings.budget||{},p=plM(m);return Object.keys(b).filter(id=>ACC[id]&&b[id]>0).map(id=>({id,name:ACC[id].name,bud:b[id],act:p.by[id]||0}))}

function rpDiff(cur,prev,good){if(prev==null)return"<td></td>";const d=cur-prev;if(!d)return `<td class="n">±0</td>`;return `<td class="n ${(d>0)===good?"inc":"exp"}">${d>0?"+":"-"}${plain(Math.abs(d))}</td>`}
function rpTables(R,prevHead,title,per){
  const out=[];for(let i=0;i<R.length;i+=per){const part=R.slice(i,i+per),cols=prevHead?3:2;
    out.push(`<div><h2>${title}${i?"（続き）":""}</h2><table><thead><tr><th>科目</th><th>金額</th>${prevHead?`<th>${prevHead}</th>`:""}</tr></thead><tbody>${part.map(r=>r.t==="head"?`<tr class="head"><td colspan="${cols}">${r.label}</td></tr>`:
      `<tr class="${r.t==="acc"?"":r.t}"><td class="${r.t==="acc"?"ind":""}">${esc(r.label)}</td><td class="n">${r.v==null?"":fmtB(r.v)}</td>${prevHead?(r.v==null?"<td></td>":rpDiff(r.v,r.pv,r.good)):""}</tr>`).join("")}</tbody></table></div>`)}
  return out;

const rpKpi=items=>`<div class="kp">${items.map(([k,v,c])=>`<div><span class="k">${k}</span><span class="v ${c||""}">${v}</span></div>`).join("")}</div>`;

}
function monthBlocks(m){
  const p=plM(m),pp=plM(addM(m,-1)),b=bsAt(m),pb=bsAt(addM(m,-1)),rate=p.rev?Math.round(p.net/p.rev*1000)/10+"%":"―",B=[];
  B.push(`<div><h1>月次レポート　${mLabel(m)}</h1><div class="meta">ふところ帳　作成日 ${dateOf(new Date()).replace(/-/g,"/")}　会計期間 1月〜12月　単位：円</div></div>`);
  B.push(rpKpi([["収益",yen(p.rev),"inc"],["費用",yen(p.exp),"exp"],["当期純利益",yen(p.net),p.net<0?"exp":""],["貯蓄率",rate],["月末の純資産",yen(b.E)]]));
  B.push(...rpTables(plRows(p,pp),"前月比","損益計算書",40));
  const br=budgetRows(m);
  if(br.length)B.push(`<div><h2>予算と実績</h2><table><thead><tr><th>科目</th><th>予算</th><th>実績</th><th>差異</th><th>消化率</th></tr></thead><tbody>${br.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${plain(r.bud)}</td><td class="n">${plain(r.act)}</td><td class="n ${r.act>r.bud?"exp":""}">${fmtB(r.bud-r.act)}</td><td class="n">${Math.round(r.act/r.bud*100)}%</td></tr>`).join("")}</tbody></table></div>`);
  B.push(...rpBreakdown(p,"費用の内訳（上位10科目）"));

function addSch(){
  const k=schForm,amt=+digits(k.amt),len=parseInt(k.len,10),dep=k.type==="dep";

  if(!(len>0&&len<=(dep?50:120))){toast(dep?"耐用年数は1〜50年で入力してください":"月数は1〜120で入力してください");return}
  if(!ACC[k.pay]||(dep&&!ACC[k.asset])||(!dep&&!ACC[k.exp])){toast("科目を選んでください");return}
  sdraft.sched=(sdraft.sched||[]).concat([{id:"k"+Date.now().toString(36),type:k.type,name:k.name.trim(),date:k.date,amount:amt,months:dep?len*12:len,pay:k.pay,asset:dep?k.asset:"maebarai",exp:dep?"depx":k.exp}]);

function journalCSV(){
  const q=s=>{s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const out=["日付,伝票,借方科目,借方金額,貸方科目,貸方金額,摘要"];
  sortE(entries().slice()).reverse().forEach((e,no)=>{const d=e.lines.filter(l=>l.s==="d"),c=e.lines.filter(l=>l.s==="c");
    for(let i=0;i<Math.max(d.length,c.length);i++)out.push([e.date,no+1,d[i]?accName(d[i].a):"",d[i]?d[i].n:"",c[i]?accName(c[i].a):"",c[i]?c[i].n:"",i===0?(e.auto?"[自動] ":"")+(e.memo||""):""].map(q).join(","))});
  return out.join("\n");
}
async function migrate(){
  if(busy||mode!=="db")return;busy=true;render(true);

  const acc=id=>ACC[id]?id:"cash";let n=0;
  try{
    for(const t of oldTx){const amt=+t.amount||0;if(!(amt>0)||!t.date)continue;let lines;
      if(t.type==="expense")lines=[{s:"d",a:byName[t.cat]&&elOf(ACC[byName[t.cat]])==="X"?byName[t.cat]:"misc",n:amt},{s:"c",a:acc(t.acc),n:amt}];
      else if(t.type==="income")lines=[{s:"d",a:acc(t.acc),n:amt},{s:"c",a:byName[t.cat]&&elOf(ACC[byName[t.cat]])==="R"?byName[t.cat]:"rinji",n:amt}];
      else lines=[{s:"d",a:acc(t.to),n:amt},{s:"c",a:acc(t.acc),n:amt}];
      await jeCol.add({date:t.date,mode:t.type==="expense"||t.type==="income"?t.type:"transfer",lines,memo:t.memo||"",ts:t.ts||Date.now()});n++}
    const s=clone(settings);s.migrated=true;await setRef.set(s);setSettings(s);sdraft=null;
    toast(n+"件を取り込みました");
  }catch(e){toast(errMsg(e)+"（"+n+"件まで取り込み済み）")}
  busy=false;render(true);
}

function onField(e){
  const t=e.target,id=t.id;if(!id)return;let m;
  const num=()=>{const raw=digits(t.value),f=raw?plain(+raw):"";if(t.value!==f)t.value=f;return raw};
  if(id==="f-amount")form.amount=num();
  else if(id==="f-memo")form.memo=t.value;else if(id==="f-date")form.date=t.value;else if(id==="f-pay")form.pay=t.value;else if(id==="f-to")form.to=t.value;
  else if((m=id.match(/^j-([dc])-([an])-(\d+)$/))){const row=form[m[1]==="d"?"dr":"cr"][+m[3]];if(!row)return;if(m[2]==="a")row.a=t.value;else row.n=num();const jt=$("#jtot");if(jt)jt.innerHTML=jTotals()}
  else if(id==="c-acc"){if(e.type==="change"){calAcc=t.value;render(true)}}
  else if((m=id.match(/^s-([noh])-(\d+)$/))&&sdraft){const acc=sdraft.accounts[+m[2]];if(!acc)return;
    if(m[1]==="n")acc.name=t.value;else if(m[1]==="o")acc.open=+num()||0;else acc.hide=!t.checked;
    if(e.type==="change"||m[1]==="h")render(true)}
  else if(id.startsWith("e-")&&sdraft&&openAcc!=null){const x=sdraft.accounts[openAcc];if(!x)return;
    if(id==="e-name"){x.name=t.value;if(e.type==="change"&&!x.sys){const c=classifyLocal(x.name);sug=c&&c!==x.sec?{i:openAcc,sec:c,reason:"名前から判定"}:null;render(true)}}
    else if(id==="e-sec"){if(e.type==="change"){x.sec=t.value;sug=null;render(true)}}
    else if(id==="e-open"){x.open=+num()||0;if(e.type==="change")render(true)}
    else if(id==="e-vis"){if(e.type==="change"){x.hide=!t.checked;render(true)}}}
  else if(id.startsWith("b-")&&sdraft){const k=id.slice(2),v=+num()||0;if(!sdraft.budget)sdraft.budget={};if(v>0)sdraft.budget[k]=v;else delete sdraft.budget[k];if(e.type==="change")render(true)}
  else if(id.startsWith("d-")){const k=id.slice(2);dispForm[k]=k==="price"?num():t.value}
  else if(id==="s-new-sec")newSec=t.value;else if(id==="s-new-name")newName=t.value;
  else if(id==="imp-file"){if(e.type==="change"&&t.files&&t.files[0])readBackup(t.files[0])}
  else if(id.startsWith("k-")){const k=id.slice(2);schForm[k]=k==="amt"?num():k==="len"?digits(t.value).slice(0,3):t.value}
}

  for(let k=-5;k<=0;k++){const m=addM(cur,k),last=k===0?now.getDate():daysIn(m);
    const add=(d,mode,lines,memo)=>{if(d<=last)out.push({id:"s"+out.length,date:m+"-"+pad(d),mode,lines,memo:memo||"",ts:out.length})};
    const ex=(d,x,pay,n,memo)=>add(d,"expense",[{s:"d",a:x,n},{s:"c",a:pay,n}],memo);
    add(10,"income",[{s:"d",a:"bank",n:88000+Math.round(r()*12)*1000},{s:"c",a:"baito",n:0}].map((l,i,arr)=>i?Object.assign(l,{n:arr[0].n}):l),"");
    ex(1,"tel","card",4980,"スマホ");
    add(5,"transfer",[{s:"d",a:"cash",n:20000},{s:"c",a:"bank",n:20000}],"ATM");
    const prevCard=out.filter(e=>e.date.slice(0,7)===addM(m,-1)&&e.mode==="expense"&&e.lines[1].a==="card").reduce((t,e)=>t+e.lines[0].n,0);
    if(prevCard)add(27,"transfer",[{s:"d",a:"card",n:prevCard},{s:"c",a:"bank",n:prevCard}],"カード引き落とし");
    for(let d=2;d<=28;d+=2)ex(d,r()<.6?"food":"eat",r()<.5?"cash":"emoney",300+Math.round(r()*14)*100,"");
    add(3,"transfer",[{s:"d",a:"emoney",n:12000},{s:"c",a:"bank",n:12000}],"電子マネーにチャージ");
    ex(8,"trans","emoney",1500+Math.round(r()*30)*100,"");
    ex(14,"hobby","card",2000+Math.round(r()*60)*100,"");
    ex(18,"daily","card",800+Math.round(r()*20)*100,"");
    if(r()<.7)ex(21,"kosai","cash",3000+Math.round(r()*40)*100,"");
    if(k===-2){add(12,"journal",[{s:"d",a:"tatekae",n:3000},{s:"c",a:"cash",n:3000}],"友人の分を立替");add(19,"journal",[{s:"d",a:"cash",n:3000},{s:"c",a:"tatekae",n:3000}],"立替分を受け取り")}
    if(k===-1)add(28,"journal",[{s:"d",a:"bank",n:12},{s:"c",a:"rishi",n:12}],"普通預金利息");
    if(k===-3)ex(15,"kankon","bank",30000,"友人の結婚式");
  }
  txs=out;invalidate();form=freshForm();
}

/* ---------- on-device storage (IndexedDB) ---------- */
let dbP=null,lastBackup=null,ssPending=null;
function idb(){if(!dbP)dbP=new Promise((res,rej)=>{const r=indexedDB.open("futokoro",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("entries",{keyPath:"id"});d.createObjectStore("kv",{keyPath:"k"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbP}
function idbTx(store,mode,fn){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))}
const idbPut=(st,v)=>idbTx(st,"readwrite",s=>s.put(v));
const idbDel=(st,k)=>idbTx(st,"readwrite",s=>s.delete(k));
const idbAll=st=>idbTx(st,"readonly",s=>s.getAll());
const idbGet=(st,k)=>idbTx(st,"readonly",s=>s.get(k));
const newId=()=>"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function upsert(id,d){const e=Object.assign({id},d),i=txs.findIndex(t=>t.id===id);if(i>=0)txs[i]=e;else txs.push(e);invalidate()}
const jeLocal={
  doc:id=>({set:async d=>{await idbPut("entries",Object.assign({id},d));upsert(id,d)},delete:async()=>{await idbDel("entries",id);txs=txs.filter(t=>t.id!==id);invalidate()}}),
  add:async d=>{const id=newId();await idbPut("entries",Object.assign({id},d));upsert(id,d);return{id}}
};
const setLocal={set:async v=>{await idbPut("kv",{k:"settings",v})}};
const isMobile=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
async function saveFile(name,data,share){
  const mime=name.endsWith(".pdf")?"application/pdf":name.endsWith(".json")?"application/json":"text/plain";
  const blob=new Blob([data],{type:mime});
  if(share&&typeof File==="function"&&navigator.canShare){const f=new File([blob],name,{type:mime});
    if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return{status:"saved"}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}}}
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  return{status:"saved"};
}
const dlLocal={save:({filename,data})=>{
  if(!isMobile())return saveFile(filename,data,false);
  return new Promise((res,rej)=>{ssPending={filename,data,res,rej};$("#ss-t").textContent="「"+filename+"」を用意しました。次の画面で「ファイルに保存」などを選んでください。";$("#savesheet").hidden=false});
}};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;
  if(el.dataset.act==="ssok"&&ssPending){const p=ssPending;ssPending=null;$("#savesheet").hidden=true;saveFile(p.filename,p.data,true).then(p.res,p.rej)}
  else if(el.dataset.act==="sscancel"&&ssPending){const p=ssPending;ssPending=null;$("#savesheet").hidden=true;p.rej({code:"declined"})}});
function backupNag(){
  if(!txs.length)return `<div class="banner">はじめに、右上の「設定」で口座ごとの開始残高（今の残高）を入れてください。claude.ai 版から移す場合は、そちらで「バックアップを保存」し、この画面の設定から「バックアップから復元」で読み込みます。</div>`;
  const d=lastBackup?Math.floor((Date.now()-new Date(lastBackup+"T00:00").getTime())/864e5):null;if(d!==null&&d<14)return"";
  return `<div class="banner" style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><span>${d===null?"まだバックアップがありません。":"最後のバックアップから"+d+"日たっています。"}データはこのスマホの中だけにあるので、故障や機種変更に備えて保存しておきましょう。</span><button type="button" class="btn sm" data-act="backup">今すぐ保存</button></div>`;
}
async function boot(){
  render(true);
  try{const[s0,all,meta]=await Promise.all([idbGet("kv","settings"),idbAll("entries"),idbGet("kv","meta")]);
    setSettings(normalize(s0?s0.v:null));txs=(all||[]).filter(e=>e&&e.date&&Array.isArray(e.lines)&&e.lines.length);invalidate();
    lastBackup=meta&&meta.v&&meta.v.lastBackup||null;sync="ok";}
  catch(e){sync="error";toast("この端末に保存できません。プライベートブラウズを使っている場合は解除してください")}
  mode="db";jeCol=jeLocal;setRef=setLocal;downloadsFn=dlLocal;sampleFn=null;settings.migrated=true;form=freshForm();ensureForm();
  render(true);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
function normalize(d){
  if(!d||d.ver!==2||!Array.isArray(d.accounts)){const s=clone(DEFS);s.migrated=!!(d&&d.migrated);return s}
  const acc=d.accounts.filter(a=>a&&a.id&&SEC[a.sec]).map(a=>({id:String(a.id),name:String(a.name||"科目"),sec:a.sec,hide:!!a.hide,open:+a.open||0,sys:!!a.sys,contra:!!a.contra}));
  for(const s of DEFS.accounts.filter(a=>a.sys))if(!acc.some(a=>a.id===s.id))acc.push(clone(s));
  const sched=Array.isArray(d.sched)?d.sched.filter(s=>s&&s.id&&s.date&&+s.amount>0&&+s.months>0):[];
  const budget={};if(d.budget&&typeof d.budget==="object")for(const k in d.budget)if(+d.budget[k]>0)budget[k]=+d.budget[k];
  return{ver:2,accounts:acc,sched,budget,migrated:!!d.migrated};
}
boot();
})();
